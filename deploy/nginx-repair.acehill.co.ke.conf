# Plain HTTP on purpose: `certbot --nginx` adds the HTTPS server block and the redirect for you.
server {
    listen 80;
    listen [::]:80;
    server_name repair.acehill.co.ke;

    root /var/www/acehill/frontend;
    index index.html;
    client_max_body_size 1m;

    # The API lives under /api on the same domain, so the browser needs no CORS.
    location /api/ {
        proxy_pass http://127.0.0.1:8010/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # never trust a client-supplied value
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built files have hashed names, so they can be cached for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page app: unknown paths (/repairs/3, /track ...) fall back to index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
